name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: every release target builds
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          printf '%s\n' darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64 |
            xargs -n1 -P "$(nproc)" bash -c 'GOOS="${1%/*}" GOARCH="${1#*/}" go build -o /dev/null ./cmd/pony' _
      - name: install.sh parses
        run: bash -n install.sh
